[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "srm-and-sbi-dimer-alp"
version = "0.4.14"
description = "Simulation-based inference of reaction-diffusion parameters for DIMER (two-particle dimerization) model"
requires-python = ">=3.10"
dependencies = [
    "sbi==0.26.1",
]
authors = [
    {name = "Michael Alexander Ramírez Sierra", email = "ramirez-sierra@fias.uni-frankfurt.de"},
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["srm_and_sbi_dimer_alp*"]
