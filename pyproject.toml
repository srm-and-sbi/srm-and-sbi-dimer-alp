[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "srm-and-sbi-dimer-alp"
version = "0.4.17"
description = "Simulation-based inference of reaction-diffusion parameters for DIMER (two-particle dimerization) model"
requires-python = ">=3.10"
# Deliberately sparse: the runtime stack (torch, readdy, numpy, scipy, zarr, ...) is provided
# by the conda-first environment (env_snapshots/README.md is the canonical install guide) so a
# pip resolve can never overwrite a hardware-specific torch/ROCm build; install the package
# with `pip install -e . --no-deps` into that environment. Only the pinned sbi (the one
# pip-first dependency) and the py<3.11 TOML reader are declared.
dependencies = [
    "sbi==0.26.1",
    'tomli; python_version < "3.11"',
]
authors = [
    {name = "Michael Alexander Ramírez Sierra", email = "ramirez-sierra@fias.uni-frankfurt.de"},
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["srm_and_sbi_dimer_alp*"]
